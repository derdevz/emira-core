services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emira-frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
