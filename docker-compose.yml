services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emira-frontend
    ports:
      - "5173:80"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
